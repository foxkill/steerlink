<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SteerLink session</title>
        <style>
            /* Fallbacks; the host's own values (applyHostStyleVariables) override them inline. */
            :root {
                color-scheme: light dark;
                --color-background-primary: #ffffff;
                --color-background-secondary: #f4f5f8;
                --color-text-primary: #111522;
                --color-text-secondary: #5b6275;
                --color-border-primary: #d9dce5;
                --color-text-success: #18794e;
                --color-text-danger: #c4302b;
                --color-text-info: #2457c5;
                --accent: #ffb020;
                --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
                --font-mono: ui-monospace, "Cascadia Code", Menlo, monospace;
                --border-radius-md: 10px;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --color-background-primary: #0f1a35;
                    --color-background-secondary: #18294d;
                    --color-text-primary: #f1f2f7;
                    --color-text-secondary: #aab2c8;
                    --color-border-primary: #2b3b63;
                    --color-text-success: #4ccf8f;
                    --color-text-danger: #ff7b72;
                    --color-text-info: #8ab4ff;
                }
            }
            :root[data-theme="dark"] {
                --color-background-primary: #0f1a35;
                --color-background-secondary: #18294d;
                --color-text-primary: #f1f2f7;
                --color-text-secondary: #aab2c8;
                --color-border-primary: #2b3b63;
                --color-text-success: #4ccf8f;
                --color-text-danger: #ff7b72;
                --color-text-info: #8ab4ff;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font: 14px/1.45 var(--font-sans);
                color: var(--color-text-primary);
                background: var(--color-background-primary);
            }
            header {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 12px;
                align-items: baseline;
                padding: 10px 14px;
                border-bottom: 1px solid var(--color-border-primary);
            }
            #agent {
                font-weight: 600;
            }
            #cwd {
                color: var(--color-text-secondary);
                font: 12px var(--font-mono);
                overflow-wrap: anywhere;
            }
            #status {
                margin-left: auto;
                font-size: 12px;
                color: var(--color-text-secondary);
            }
            #status[data-status="awaiting_permission"] {
                color: var(--accent);
                font-weight: 600;
            }
            #status[data-status="running"]::before {
                content: "● ";
                color: var(--color-text-info);
            }
            #error {
                margin: 8px 14px 0;
                color: var(--color-text-danger);
                font-size: 12px;
            }
            #timeline {
                max-height: 420px;
                overflow-y: auto;
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .card {
                margin: 0;
                padding: 8px 10px;
                border-radius: var(--border-radius-md);
                background: var(--color-background-secondary);
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            .you {
                align-self: flex-end;
                max-width: 85%;
                border: 1px solid var(--color-border-primary);
                background: transparent;
            }
            .note {
                font-size: 12px;
                color: var(--color-text-secondary);
            }
            .note.success {
                color: var(--color-text-success);
            }
            .note.error {
                color: var(--color-text-danger);
            }
            .tool summary {
                cursor: pointer;
                white-space: normal;
            }
            .badge {
                font-size: 11px;
                padding: 1px 6px;
                border-radius: 999px;
                border: 1px solid var(--color-border-primary);
            }
            .badge.status-completed {
                color: var(--color-text-success);
            }
            .badge.status-failed {
                color: var(--color-text-danger);
            }
            .path {
                margin-top: 6px;
                font: 12px var(--font-mono);
                color: var(--color-text-secondary);
            }
            pre {
                margin: 4px 0 0;
                padding: 8px;
                max-height: 260px;
                overflow: auto;
                font: 12px/1.4 var(--font-mono);
                border-radius: 6px;
                background: var(--color-background-primary);
                border: 1px solid var(--color-border-primary);
                white-space: pre;
            }
            .plan {
                padding-left: 28px;
                white-space: normal;
            }
            .plan-completed {
                text-decoration: line-through;
                color: var(--color-text-secondary);
            }
            #pending:empty {
                display: none;
            }
            .pending {
                margin: 0 14px 10px;
                padding: 10px;
                border: 2px solid var(--accent);
                border-radius: var(--border-radius-md);
            }
            .pending-title {
                font-weight: 600;
            }
            .buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 8px;
            }
            button {
                font: inherit;
                padding: 6px 12px;
                border-radius: 8px;
                border: 1px solid var(--color-border-primary);
                background: var(--color-background-secondary);
                color: var(--color-text-primary);
                cursor: pointer;
            }
            button.allow {
                background: var(--accent);
                border-color: var(--accent);
                color: #0f1a35;
                font-weight: 600;
            }
            button.allow-always {
                border-color: var(--accent);
            }
            button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            footer {
                display: flex;
                gap: 8px;
                padding: 10px 14px;
                border-top: 1px solid var(--color-border-primary);
            }
            textarea {
                flex: 1;
                min-height: 38px;
                resize: vertical;
                font: inherit;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid var(--color-border-primary);
                background: var(--color-background-primary);
                color: var(--color-text-primary);
            }
        </style>
    </head>
    <body>
        <header>
            <span id="agent">Agent</span>
            <span id="cwd"></span>
            <span id="status">Connecting…</span>
        </header>
        <div id="error" role="alert" hidden></div>
        <main id="timeline" aria-live="polite"></main>
        <div id="pending"></div>
        <footer>
            <textarea
                id="message"
                placeholder="Message to the agent (Ctrl+Enter to send)"
                aria-label="Message to the agent"
            ></textarea>
            <button id="send" type="button">Send</button>
            <button id="stop" type="button" disabled>Stop</button>
        </footer>
        <!-- steerlink:script -->
    </body>
</html>
